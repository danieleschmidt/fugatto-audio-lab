
apiVersion: v1
kind: Service
metadata:
  name: fugatto-audio-lab-service
  namespace: production
  labels:
    app: fugatto-audio-lab
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: metrics
  selector:
    app: fugatto-audio-lab
