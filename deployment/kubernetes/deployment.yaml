
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fugatto-audio-lab
  namespace: production
  labels:
    app: fugatto-audio-lab
    version: 1.0.0
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  selector:
    matchLabels:
      app: fugatto-audio-lab
  template:
    metadata:
      labels:
        app: fugatto-audio-lab
        version: 1.0.0
    spec:
      containers:
      - name: fugatto-audio-lab
        image: fugatto-audio-lab:1.0.0
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 8080
          name: metrics
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: METRICS_ENABLED
          value: "true"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: fugatto-audio-lab-config
      imagePullSecrets:
      - name: registry-credentials
